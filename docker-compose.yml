services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: forgeflow-postgres
    environment:
      POSTGRES_DB: forgeflow
      POSTGRES_USER: forgeflow
      POSTGRES_PASSWORD: forgeflow
    ports:
      - "5433:5432"
    volumes:
      - forgeflow-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgeflow -d forgeflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional: shared rate-limit buckets. Without it (no REDIS_URL) the app
  # rate-limits in memory, which is correct for a single instance.
  redis:
    image: redis:7-alpine
    container_name: forgeflow-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  forgeflow-pgdata:
