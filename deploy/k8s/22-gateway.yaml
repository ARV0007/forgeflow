# The edge. Stateless, so two replicas from the start.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: forgeflow
  labels: { app: gateway, app.kubernetes.io/part-of: forgeflow }
spec:
  replicas: 2
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
    spec:
      containers:
        - name: gateway
          image: forgeflow-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: forgeflow-secrets, key: JWT_SECRET } }
            - { name: CORE_URL, value: "http://api:8081" }
            # {token}.preview.forgeflow.local -> preview.ffp-{token}.svc (the preview's own pod)
            - { name: PREVIEW_DOMAIN, value: preview.forgeflow.local }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: forgeflow
spec:
  selector: { app: gateway }
  ports:
    - { port: 80, targetPort: 8080 }
---
# ingress-nginx in front of the gateway. Buffering OFF and long read
# timeouts: chat replies and live logs are Server-Sent Events, and a
# buffering proxy anywhere on the path holds every event until the stream
# ends.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: forgeflow
  namespace: forgeflow
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: forgeflow.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: gateway, port: { number: 80 } }
    # Every preview is a subdomain; the gateway picks the pod by the token in it.
    - host: "*.preview.forgeflow.local"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: gateway, port: { number: 80 } }
