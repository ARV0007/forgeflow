# Backing services, single-replica and dev-grade so the whole topology runs on
# kind or minikube. In production each of these is a managed service or an
# operator (CloudNativePG, Strimzi, the MinIO operator, Qdrant Cloud) - the
# app only ever sees the URLs in 10-config.yaml, so swapping is config.
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: postgres, namespace: forgeflow }
spec:
  serviceName: postgres
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          env:
            - { name: POSTGRES_DB, value: forgeflow }
            - { name: POSTGRES_USER, value: forgeflow }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: forgeflow-secrets, key: DB_PASSWORD } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [{ containerPort: 5432 }]
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "forgeflow", "-d", "forgeflow"] }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 5Gi } } }
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: forgeflow }
spec: { selector: { app: postgres }, ports: [{ port: 5432 }] }
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: kafka, namespace: forgeflow }
spec:
  serviceName: kafka
  replicas: 1
  selector: { matchLabels: { app: kafka } }
  template:
    metadata: { labels: { app: kafka } }
    spec:
      # Kubernetes injects KAFKA_PORT=tcp://... for the Service named "kafka",
      # and the image reads every KAFKA_* variable as broker config. Off.
      enableServiceLinks: false
      containers:
        - name: kafka
          image: apache/kafka:3.8.0
          env:
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:9092" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: KAFKA_NUM_PARTITIONS, value: "3" }
          ports: [{ containerPort: 9092 }]
          volumeMounts: [{ name: data, mountPath: /var/lib/kafka/data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 5Gi } } }
---
apiVersion: v1
kind: Service
metadata: { name: kafka, namespace: forgeflow }
spec: { selector: { app: kafka }, ports: [{ port: 9092 }] }
---
# Object storage over the S3 API. MinIO no longer publishes community images,
# so this is Zenko CloudServer (S3-compatible, verifies SigV4) - the service
# keeps the name "minio" from the diagram; the app only knows S3_ENDPOINT.
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: minio, namespace: forgeflow }
spec:
  serviceName: minio
  replicas: 1
  selector: { matchLabels: { app: minio } }
  template:
    metadata: { labels: { app: minio } }
    spec:
      containers:
        - name: s3
          image: zenko/cloudserver:latest
          env:
            - { name: REMOTE_MANAGEMENT_DISABLE, value: "1" }
            - { name: S3BACKEND, value: file }
          ports: [{ containerPort: 8000 }]
          readinessProbe:
            tcpSocket: { port: 8000 }
          volumeMounts:
            - { name: data, mountPath: /usr/src/app/localData }
            - { name: meta, mountPath: /usr/src/app/localMetadata }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 5Gi } } }
    - metadata: { name: meta }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 1Gi } } }
---
apiVersion: v1
kind: Service
metadata: { name: minio, namespace: forgeflow }
spec: { selector: { app: minio }, ports: [{ name: s3, port: 8000 }] }
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: qdrant, namespace: forgeflow }
spec:
  serviceName: qdrant
  replicas: 1
  selector: { matchLabels: { app: qdrant } }
  template:
    metadata: { labels: { app: qdrant } }
    spec:
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.12.4
          ports: [{ containerPort: 6333 }]
          readinessProbe:
            httpGet: { path: /readyz, port: 6333 }
          volumeMounts: [{ name: data, mountPath: /qdrant/storage }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 5Gi } } }
---
apiVersion: v1
kind: Service
metadata: { name: qdrant, namespace: forgeflow }
spec: { selector: { app: qdrant }, ports: [{ port: 6333 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: redis, namespace: forgeflow }
spec:
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{ containerPort: 6379 }]
---
apiVersion: v1
kind: Service
metadata: { name: redis, namespace: forgeflow }
spec: { selector: { app: redis }, ports: [{ port: 6379 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: zipkin, namespace: forgeflow }
spec:
  replicas: 1
  selector: { matchLabels: { app: zipkin } }
  template:
    metadata: { labels: { app: zipkin } }
    spec:
      containers:
        - name: zipkin
          image: openzipkin/zipkin:3
          ports: [{ containerPort: 9411 }]
---
apiVersion: v1
kind: Service
metadata: { name: zipkin, namespace: forgeflow }
spec: { selector: { app: zipkin }, ports: [{ port: 9411 }] }
