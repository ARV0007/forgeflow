# The API: every module, serving HTTP. Publishes code.generated to Kafka and
# leaves indexing to the worker.
#
# Two replicas, scaled to six on CPU. The API keeps no state of its own:
# chat locks, the preview Logs Stream and rate limits are in Redis; files in
# S3; vectors in Qdrant; previews and everything else in Postgres; events in
# Kafka. So the Service can send any request to any pod, and a pod can die
# mid-stream without taking a session lock with it (the lock expires).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: forgeflow
  labels: { app: api, app.kubernetes.io/part-of: forgeflow }
spec:
  replicas: 2
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: forgeflow:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef: { name: forgeflow-config }
            - secretRef: { name: forgeflow-secrets }
          env:
            - { name: FORGEFLOW_INSTANCE, value: api }
            - { name: SPRING_APPLICATION_NAME, value: forgeflow-api }
            - { name: FORGEFLOW_INDEXER_ENABLED, value: "false" }
            - { name: APP_BASE_URL, value: "https://forgeflow.example.com" }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 1Gi }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8081 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8081 }
            initialDelaySeconds: 60
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: forgeflow
spec:
  selector: { app: api }
  ports:
    - { port: 8081, targetPort: 8081 }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: forgeflow
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: api }
  minReplicas: 2            # one can be replaced while the other serves
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
---
# Never take both API pods down at once during node maintenance.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
  namespace: forgeflow
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: api }
