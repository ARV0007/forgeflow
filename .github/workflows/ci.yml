# Build and test on every push and pull request.
#
# Exists because of Day 9: the eval harness recorded a model regression a full
# day before anyone looked, and it made no difference because nothing was
# watching. A result nobody is notified of is a result that does not exist.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    # Same image as docker-compose.yml, so Flyway's CREATE EXTENSION vector
    # works exactly as it does locally.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: forgeflow
          POSTGRES_USER: forgeflow
          POSTGRES_PASSWORD: forgeflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forgeflow -d forgeflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # The rate limiter's Redis tests skip when Redis is absent; here it is
      # present, so they run. Same major version Render's Key Value offers.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      # The full-topology pieces. Their integration tests skip when the env
      # var naming them is unset (a laptop without Docker); here they run
      # against the real thing.
      kafka:
        image: apache/kafka:3.8.0        # single-node KRaft, PLAINTEXT on 9092, advertised as localhost
        ports:
          - 9092:9092
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12

      qdrant:
        image: qdrant/qdrant:v1.12.4
        ports:
          - 6333:6333

    env:
      DB_URL: jdbc:postgresql://localhost:5432/forgeflow
      # No Docker daemon inside the job's sandbox path, same as Render: use the
      # in-JVM provider. The config seam that made the deploy possible makes
      # CI possible too.
      FORGEFLOW_SANDBOX_PROVIDER: in-process
      REDIS_TEST_URL: redis://localhost:6379
      KAFKA_BOOTSTRAP_SERVERS: localhost:9092
      QDRANT_TEST_URL: http://localhost:6333
      S3_TEST_ENDPOINT: http://localhost:9000
      S3_TEST_ACCESS_KEY: minioadmin
      S3_TEST_SECRET_KEY: minioadmin
      S3_TEST_STRICT: "true"          # MinIO verifies SigV4 signatures; moto (handy locally) doesn't

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # An S3 server that checks signatures. MinIO first (it needs a command,
      # "server /data", which service containers can't pass - so it's a
      # step). MinIO stopped publishing new community images in 2025, so try
      # pinned releases, then fall back to Zenko CloudServer (also verifies
      # SigV4). Whichever starts sets the S3_TEST_* variables for the tests,
      # and the run summary says which one it was.
      - name: Start an S3 server
        run: |
          started=""
          for img in minio/minio:RELEASE.2025-04-22T22-12-26Z quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z minio/minio:RELEASE.2024-12-18T13-15-44Z quay.io/minio/minio:latest; do
            if docker pull -q "$img"; then
              docker run -d --name s3 -p 9000:9000 -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin "$img" server /data
              started="$img"; break
            fi
          done
          if [ -z "$started" ]; then
            docker run -d --name s3 -p 9000:8000 -e REMOTE_MANAGEMENT_DISABLE=1 zenko/cloudserver
            started="zenko/cloudserver"
            echo "S3_TEST_ACCESS_KEY=accessKey1" >> "$GITHUB_ENV"
            echo "S3_TEST_SECRET_KEY=verySecretKey1" >> "$GITHUB_ENV"
          fi
          for i in $(seq 1 45); do
            curl -s -o /dev/null http://localhost:9000/ && break
            sleep 2
          done
          echo "::notice title=S3 server::${started}"

      - name: Build and test
        run: ./mvnw -B verify

      # The gateway is its own deployable with its own tests.
      - name: Build and test the gateway
        run: ./mvnw -B -f gateway/pom.xml verify

      # The deployment files parse, and every service the compose file
      # depends on exists - cheap checks that catch the typos.
      - name: Check deployment files
        run: |
          docker compose -f docker-compose.full.yml config --quiet
          python3 -c "import yaml,glob; [list(yaml.safe_load_all(open(f))) for f in glob.glob('deploy/k8s/*.yaml')]; print('k8s yaml ok')"

      # Proof the infrastructure tests ran rather than skipped: one annotation
      # per integration-test class, readable from the run summary.
      - name: Report integration tests
        if: always()
        run: |
          for f in target/surefire-reports/TEST-*IntegrationTest.xml target/surefire-reports/TEST-*Shared*Test.xml target/surefire-reports/TEST-*ModeTest*.xml target/surefire-reports/TEST-*EndToEndTest.xml; do
            [ -f "$f" ] || continue
            name=$(basename "$f" .xml | sed 's/^TEST-com.forgeflow.//')
            line=$(grep -o '<testsuite [^>]*>' "$f" | head -1)
            tests=$(echo "$line" | grep -o ' tests="[0-9]*"' | grep -o '[0-9]*')
            skipped=$(echo "$line" | grep -o ' skipped="[0-9]*"' | grep -o '[0-9]*')
            failures=$(echo "$line" | grep -o ' failures="[0-9]*"' | grep -o '[0-9]*')
            echo "::notice title=${name}::tests=${tests} skipped=${skipped} failures=${failures}"
          done
