# ForgeFlow, full topology - the architecture diagram, running.
#
#   docker compose -f docker-compose.full.yml up --build
#   open http://localhost:8080           (the gateway: the only public door)
#
#   browser ──► gateway :8080 ──► api :8081 ──► postgres (rows, keyword index)
#                 edge JWT check      │   ├──► minio      (file contents)
#                 routing, SSE        │   ├──► qdrant     (vector search)
#                                     │   ├──► redis      (rate limits)
#                                     │   └──► kafka ── code.generated ──┐
#                                     │                                  ├─► worker  (group "indexer": chunk, embed, ingest)
#                                     │◄─────────────────────────────────┘   api     (group "execution": preview notices)
#                                     └──► zipkin :9411 (one trace: request → publish → consume)
#
# Same jar as the all-in-one deployment on Render: every box here is a
# config switch (FORGEFLOW_EVENTS, FORGEFLOW_FILE_STORAGE, FORGEFLOW_VECTOR_STORE,
# FORGEFLOW_INDEXER_ENABLED), not a fork of the code.
#
# GOOGLE_API_KEY and JWT_SECRET come from your shell or a .env file next to
# this one. Without a key, set FORGEFLOW_LLM_PROVIDER=demo for the offline model.

x-forgeflow-env: &forgeflow-env
  DB_URL: jdbc:postgresql://postgres:5432/forgeflow
  JWT_SECRET: ${JWT_SECRET:-change-me-in-env-this-is-local-only-0123456789}
  GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
  FORGEFLOW_LLM_PROVIDER: ${FORGEFLOW_LLM_PROVIDER:-gemini}
  FORGEFLOW_SANDBOX_PROVIDER: in-process
  REDIS_URL: redis://redis:6379
  ZIPKIN_URL: http://zipkin:9411
  FORGEFLOW_EVENTS: kafka
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  FORGEFLOW_FILE_STORAGE: s3
  S3_ENDPOINT: http://minio:9000
  S3_BUCKET: forgeflow-files
  S3_ACCESS_KEY: forgeflow
  S3_SECRET_KEY: forgeflow-minio-secret
  FORGEFLOW_VECTOR_STORE: qdrant
  QDRANT_URL: http://qdrant:6333
  APP_BASE_URL: http://localhost:8080

services:

  gateway:
    build: ./gateway
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET:-change-me-in-env-this-is-local-only-0123456789}
      CORE_URL: http://api:8081
    depends_on:
      api:
        condition: service_healthy

  api:
    build: .
    environment:
      <<: *forgeflow-env
      FORGEFLOW_INSTANCE: api
      SPRING_APPLICATION_NAME: forgeflow-api      # its spans' service name in Zipkin
      FORGEFLOW_INDEXER_ENABLED: "false"        # indexing is the worker's job
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /actuator/health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
    depends_on: &infra
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
      minio: { condition: service_healthy }
      qdrant: { condition: service_started }

  # Same image, different job: consumes code.generated as group "indexer".
  # Scale it (--scale worker=3) and Kafka spreads the partitions across them.
  worker:
    build: .
    environment:
      <<: *forgeflow-env
      PORT: "8082"
      FORGEFLOW_INSTANCE: worker
      SPRING_APPLICATION_NAME: forgeflow-worker
      FORGEFLOW_INDEXER_ENABLED: "true"
      FORGEFLOW_INDEX_ON_GENERATE: sync         # on the consumer thread, so the offset commits only after success
      FORGEFLOW_PREVIEW_NOTICES: "false"        # serves no previews
    depends_on: *infra

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: forgeflow
      POSTGRES_USER: forgeflow
      POSTGRES_PASSWORD: forgeflow
    volumes:
      - full-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgeflow -d forgeflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 12

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: forgeflow
      MINIO_ROOT_PASSWORD: forgeflow-minio-secret
    ports:
      - "9001:9001"             # MinIO console: see the blobs
    volumes:
      - full-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"             # Qdrant dashboard at /dashboard
    volumes:
      - full-qdrant:/qdrant/storage

  zipkin:
    image: openzipkin/zipkin:3
    ports:
      - "9411:9411"             # traces, including request -> Kafka -> worker

volumes:
  full-pgdata:
  full-minio:
  full-qdrant:
