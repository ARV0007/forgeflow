<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreshCart - Groceries delivered</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/product-card.css">
  <link rel="stylesheet" href="css/theme-dark.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html">FreshCart</a>
    <nav class="main-nav">
      <a href="products.html" data-i18n="nav.shop">Shop</a>
      <a href="cart.html" data-i18n="nav.cart">Cart <span id="cart-count">0</span></a>
      <a href="account.html" data-i18n="nav.account">Account</a>
    </nav>
    <button id="theme-toggle" aria-label="Switch colour theme">Theme</button>
  </header>

  <main>
    <section class="hero">
      <h1 data-i18n="hero.title">Fresh food at your door in an hour</h1>
      <p data-i18n="hero.subtitle">Fruit, vegetables and bakery, picked this morning.</p>
      <a class="button" href="products.html" data-i18n="hero.cta">Start shopping</a>
    </section>

    <section>
      <h2 data-i18n="home.featured">Featured this week</h2>
      <div id="featured-grid" class="product-grid"></div>
    </section>
  </main>

  <div id="toast-root"></div>

  <script src="js/storage.js"></script>
  <script src="js/currency.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
