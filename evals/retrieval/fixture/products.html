<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop - FreshCart</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/product-card.css">
  <link rel="stylesheet" href="css/theme-dark.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html">FreshCart</a>
    <nav class="main-nav">
      <a href="products.html">Shop</a>
      <a href="cart.html">Cart <span id="cart-count">0</span></a>
    </nav>
  </header>

  <main class="shop">
    <aside class="filters">
      <input id="search-box" type="search" placeholder="Search products">
      <select id="category-filter">
        <option value="all">All categories</option>
        <option value="fruit">Fruit</option>
        <option value="vegetables">Vegetables</option>
        <option value="bakery">Bakery</option>
        <option value="dairy">Dairy</option>
      </select>
      <select id="sort-order">
        <option value="popular">Most popular</option>
        <option value="price-asc">Price: low to high</option>
        <option value="price-desc">Price: high to low</option>
        <option value="name">Name A-Z</option>
      </select>
      <label><input id="in-stock-only" type="checkbox"> In stock only</label>
    </aside>
    <div id="product-grid" class="product-grid"></div>
    <p id="no-results" hidden>No products match your search.</p>
  </main>

  <div id="toast-root"></div>

  <script src="js/storage.js"></script>
  <script src="js/currency.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/products.js"></script>
  <script src="js/product-filter.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
