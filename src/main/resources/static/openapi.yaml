openapi: 3.1.0
info:
  title: ForgeFlow API
  version: "0.3"
  description: |
    Describe an app in plain English and get a working, running app back.

    **Auth.** `POST /api/v1/auth/signup` or `/login` returns a JWT. Send it as
    `Authorization: Bearer <token>` on everything else.

    **Errors** are RFC 9457 problem details (`application/problem+json`) with
    a `traceId` you can quote when reporting a problem.

    | Status | Means |
    |---|---|
    | 401 | not signed in |
    | 403 | you can see this project, but your role can't do that |
    | 404 | doesn't exist - **or** you have no access to it (indistinguishable on purpose) |
    | 402 | a plan limit (`quota`, `limit`, `used`, `plan` in the body) |
    | 409 | conflicts with current state (a reply already running, nothing to retry, ...) |
    | 429 | rate limited - see `Retry-After` |

    Every response carries `traceparent` and `X-Trace-Id` headers. Send a W3C
    `traceparent` and ForgeFlow continues your trace.

    This document is checked against the running application by
    `OpenApiContractTest`: an endpoint added without being documented here
    fails the build.
servers:
  - url: /
security:
  - bearer: []

tags:
  - name: Auth
  - name: Projects
  - name: Members
  - name: AI generation
  - name: Chat
  - name: Files
  - name: Preview
  - name: Search
  - name: Billing
  - name: MCP

paths:
  # ------------------------------------------------------------------ auth
  /api/v1/auth/signup:
    post:
      tags: [Auth]
      summary: Create an account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                name: { type: string }
      responses:
        "201": { description: Signed up, content: { application/json: { schema: { $ref: "#/components/schemas/AuthResponse" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Sign in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200": { description: Signed in, content: { application/json: { schema: { $ref: "#/components/schemas/AuthResponse" } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/me:
    get:
      tags: [Auth]
      summary: Get my profile
      responses:
        "200": { description: You, content: { application/json: { schema: { $ref: "#/components/schemas/Profile" } } } }
        "401": { $ref: "#/components/responses/Problem" }
    patch:
      tags: [Auth]
      summary: Update my name or avatar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 120 }
                avatarUrl: { type: string, description: "https:// only" }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Profile" } } } }
        "400": { $ref: "#/components/responses/Problem" }

  # -------------------------------------------------------------- projects
  /api/v1/me/tokens:
    get:
      tags: [Account]
      summary: My personal access tokens (never the secrets)
      responses:
        "200": { description: Tokens, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ApiToken" } } } } }
    post:
      tags: [Account]
      summary: Create a personal access token - for MCP clients, scripts, CI. The secret is returned ONCE.
      description: >
        Send it as "Authorization: Bearer ff_pat_...". It works anywhere a sign-in
        does, and on /mcp the tools act as you. Stored only as a SHA-256 hash.
        Needs a signed-in session: a token can't create or revoke tokens.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string, maxLength: 80 } } } } }
      responses:
        "201": { description: Created - copy the token now, content: { application/json: { schema: { $ref: "#/components/schemas/ApiToken" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/me/tokens/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    delete:
      tags: [Account]
      summary: Revoke a token (signed-in session only)
      responses:
        "204": { description: Revoked }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /api/v1/projects:
    get:
      tags: [Projects]
      summary: List projects I own or am a member of
      responses:
        "200":
          description: Projects, each with my role
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Project" } } } }
    post:
      tags: [Projects]
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 120 }
                description: { type: string }
                stack: { type: string, enum: [STATIC, REACT], default: STATIC, description: fixed for the project's life }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
        "402": { $ref: "#/components/responses/QuotaExceeded" }

  /api/v1/projects/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [Projects]
      summary: Get a project (READ)
      responses:
        "200": { description: The project, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      tags: [Projects]
      summary: Update a project (ADMIN - owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 120 }
                description: { type: string }
                isPublic: { type: boolean }
                thumbnailUrl: { type: string }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [Projects]
      summary: Delete a project (ADMIN - soft delete)
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  # --------------------------------------------------------------- members
  /api/v1/projects/{projectId}/members:
    parameters: [{ $ref: "#/components/parameters/projectId" }]
    get:
      tags: [Members]
      summary: List the owner and members (READ)
      responses:
        "200": { description: Members, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Member" } } } } }
    post:
      tags: [Members]
      summary: Invite someone by email (ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email }
                role: { type: string, enum: [EDITOR, VIEWER] }
      responses:
        "201": { description: Added, content: { application/json: { schema: { $ref: "#/components/schemas/Member" } } } }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/projects/{projectId}/members/{userId}:
    parameters:
      - { $ref: "#/components/parameters/projectId" }
      - { name: userId, in: path, required: true, schema: { type: integer, format: int64 } }
    patch:
      tags: [Members]
      summary: Change a member's role (ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [role], properties: { role: { type: string, enum: [EDITOR, VIEWER] } } }
      responses:
        "200": { description: Changed, content: { application/json: { schema: { $ref: "#/components/schemas/Member" } } } }
    delete:
      tags: [Members]
      summary: Remove a member (ADMIN), or leave (yourself)
      responses:
        "204": { description: Removed }

  # --------------------------------------------------------- AI generation
  /api/v1/projects/{projectId}/generate:
    parameters: [{ $ref: "#/components/parameters/projectId" }]
    post:
      tags: [AI generation]
      summary: One-shot generation (WRITE) - waits for the whole run
      requestBody: { $ref: "#/components/requestBodies/Prompt" }
      responses:
        "200": { description: The finished run, content: { application/json: { schema: { $ref: "#/components/schemas/GenerateResponse" } } } }
        "402": { $ref: "#/components/responses/QuotaExceeded" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/projects/{projectId}/generate/stream:
    parameters: [{ $ref: "#/components/parameters/projectId" }]
    post:
      tags: [AI generation]
      summary: Generation as Server-Sent Events (WRITE)
      requestBody: { $ref: "#/components/requestBodies/Prompt" }
      responses:
        "200": { $ref: "#/components/responses/AgentEvents" }
        "402": { $ref: "#/components/responses/QuotaExceeded" }
        "429": { $ref: "#/components/responses/RateLimited" }

  # ------------------------------------------------------------------ chat
  /api/v1/projects/{projectId}/chat/sessions:
    parameters: [{ $ref: "#/components/parameters/projectId" }]
    get:
      tags: [Chat]
      summary: List chat sessions (READ), most recent first
      responses:
        "200": { description: Sessions, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ChatSession" } } } } }
    post:
      tags: [Chat]
      summary: Create a chat session (WRITE)
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, properties: { title: { type: string, maxLength: 200, description: "Defaults to the first message" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/ChatSession" } } } }

  /api/v1/projects/{projectId}/chat/sessions/{sessionId}:
    parameters: [{ $ref: "#/components/parameters/projectId" }, { $ref: "#/components/parameters/sessionId" }]
    patch:
      tags: [Chat]
      summary: Rename a session (WRITE)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [title], properties: { title: { type: string, maxLength: 200 } } }
      responses:
        "200": { description: Renamed, content: { application/json: { schema: { $ref: "#/components/schemas/ChatSession" } } } }
    delete:
      tags: [Chat]
      summary: Delete a session (WRITE)
      responses:
        "204": { description: Deleted }

  /api/v1/projects/{projectId}/chat/sessions/{sessionId}/messages:
    parameters: [{ $ref: "#/components/parameters/projectId" }, { $ref: "#/components/parameters/sessionId" }]
    get:
      tags: [Chat]
      summary: Load the full chat history (READ), oldest first
      responses:
        "200": { description: Messages, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ChatMessage" } } } } }
    post:
      tags: [Chat]
      summary: Send a message and wait for the reply (WRITE)
      requestBody: { $ref: "#/components/requestBodies/Message" }
      responses:
        "200": { description: The exchange, content: { application/json: { schema: { $ref: "#/components/schemas/ChatTurn" } } } }
        "402": { $ref: "#/components/responses/QuotaExceeded" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/projects/{projectId}/chat/sessions/{sessionId}/messages/stream:
    parameters: [{ $ref: "#/components/parameters/projectId" }, { $ref: "#/components/parameters/sessionId" }]
    post:
      tags: [Chat]
      summary: Chat stream - agent events, then a final `message` event (WRITE)
      requestBody: { $ref: "#/components/requestBodies/Message" }
      responses:
        "200": { $ref: "#/components/responses/AgentEvents" }
        "402": { $ref: "#/components/responses/QuotaExceeded" }
        "409": { $ref: "#/components/responses/Problem" }

  /api/v1/projects/{projectId}/chat/sessions/{sessionId}/messages/{messageId}/attachments/{attachmentId}:
    parameters:
      - { $ref: "#/components/parameters/projectId" }
      - { $ref: "#/components/parameters/sessionId" }
      - { name: messageId, in: path, required: true, schema: { type: integer, format: int64 } }
      - { name: attachmentId, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      tags: [Chat]
      summary: An image sent with a message (READ)
      responses:
        "200": { description: The image, content: { image/png: { schema: { type: string, format: binary } }, image/jpeg: { schema: { type: string, format: binary } }, image/webp: { schema: { type: string, format: binary } } } }
        "404": { $ref: "#/components/responses/Problem" }

  /api/v1/projects/{projectId}/chat/sessions/{sessionId}/messages/{messageId}/visual-review:
    parameters:
      - { $ref: "#/components/parameters/projectId" }
      - { $ref: "#/components/parameters/sessionId" }
      - { name: messageId, in: path, required: true, description: the assistant reply whose result is on screen, schema: { type: integer, format: int64 } }
    post:
      tags: [Chat]
      summary: AI checks its own app - a vision model reviews a screenshot of the preview (WRITE, metered)
      description: >
        The workbench screenshots the live preview in the browser right after a reply
        lands and sends it here. A vision model judges it against the conversation's
        requests. NEEDS_FIXES means at least one major issue; the workbench then sends
        one follow-up turn asking the agent to fix them. The latest review is returned
        on the reply in the message history.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [screenshot]
              properties:
                screenshot:
                  type: object
                  required: [mimeType, data]
                  properties:
                    mimeType: { type: string, enum: [image/png, image/jpeg, image/webp] }
                    data: { type: string, description: base64, no data-URL prefix; at most 4 MB decoded }
      responses:
        "200": { description: The verdict, content: { application/json: { schema: { $ref: "#/components/schemas/VisualReview" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "402": { $ref: "#/components/responses/QuotaExceeded" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /api/v1/projects/{projectId}/chat/sessions/{sessionId}/retry:
    parameters: [{ $ref: "#/components/parameters/projectId" }, { $ref: "#/components/parameters/sessionId" }]
    post:
      tags: [Chat]
      summary: Retry the last question - only if its reply failed (WRITE)
      responses:
        "200": { description: The retried exchange, content: { application/json: { schema: { $ref: "#/components/schemas/ChatTurn" } } } }
        "409": { $ref: "#/components/responses/Problem" }

  /api/v1/projects/{projectId}/chat/sessions/{sessionId}/retry/stream:
    parameters: [{ $ref: "#/components/parameters/projectId" }, { $ref: "#/components/parameters/sessionId" }]
    post:
      tags: [Chat]
      summary: Retry, streamed (WRITE)
      responses:
        "200": { $ref: "#/components/responses/AgentEvents" }
        "409": { $ref: "#/components/responses/Problem" }

  # ----------------------------------------------------------------- files
  /api/v1/projects/{projectId}/files:
    parameters: [{ $ref: "#/components/parameters/projectId" }]
    get:
      tags: [Files]
      summary: File tree (READ)
      responses:
        "200": { description: Files, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/FileEntry" } } } } }

  /api/v1/projects/{projectId}/files/content:
    parameters: [{ $ref: "#/components/parameters/projectId" }]
    get:
      tags: [Files]
      summary: File content (READ)
      parameters: [{ name: path, in: query, required: true, schema: { type: string }, example: index.html }]
      responses:
        "200":
          description: The file
          content: { application/json: { schema: { type: object, properties: { path: { type: string }, content: { type: string } } } } }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      tags: [Files]
      summary: Save a file by hand - create or overwrite (WRITE)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, content]
              properties:
                path: { type: string, example: js/cart.js }
                content: { type: string }
      responses:
        "200":
          description: Saved
          content: { application/json: { schema: { type: object, properties: { path: { type: string }, version: { type: integer }, sizeBytes: { type: integer } } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }

  /api/v1/projects/{projectId}/files/download:
    parameters: [{ $ref: "#/components/parameters/projectId" }]
    get:
      tags: [Files]
      summary: Download every file as a zip (READ)
      responses:
        "200":
          description: "A zip with one top-level folder named after the project"
          content: { application/zip: { schema: { type: string, format: binary } } }

  # --------------------------------------------------------------- history
  /api/v1/projects/{projectId}/site:
    parameters: [{ $ref: "#/components/parameters/projectId" }]
    get:
      tags: [Preview]
      summary: The published site and its release history (READ)
      responses:
        "200": { description: The site, content: { application/json: { schema: { $ref: "#/components/schemas/Site" } } } }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      tags: [Preview]
      summary: Publish - the project as it is now, or a chosen version (rollback) (WRITE)
      description: >
        The site serves a checkpoint, never the live files, so it stays exactly as
        published while the project changes. Public at /s/{slug}/ - no token -
        under the same sandbox CSP as previews. The slug is kept across
        unpublish / publish.
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, properties: { checkpointId: { type: integer, format: int64, description: "omit to publish the current files" } } }
      responses:
        "200": { description: Published, content: { application/json: { schema: { $ref: "#/components/schemas/Site" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [Preview]
      summary: Unpublish (WRITE) - the address is kept for next time
      responses:
        "204": { description: Unpublished }
        "404": { $ref: "#/components/responses/Problem" }

  /api/v1/projects/{projectId}/checkpoints:
    parameters: [{ $ref: "#/components/parameters/projectId" }]
    get:
      tags: [History]
      summary: Versions, newest first - one per AI run that changed files, plus baselines and restores (READ)
      parameters: [{ name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }]
      responses:
        "200": { description: Checkpoints, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Checkpoint" } } } } }

  /api/v1/projects/{projectId}/checkpoints/{checkpointId}/diff:
    parameters:
      - { $ref: "#/components/parameters/projectId" }
      - { name: checkpointId, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      tags: [History]
      summary: What changed to reach this version - unified diff per file (READ)
      parameters: [{ name: against, in: query, description: "another checkpoint id; default the one before", schema: { type: integer, format: int64 } }]
      responses:
        "200": { description: Changed files, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/FileChange" } } } } }
        "404": { $ref: "#/components/responses/Problem" }

  /api/v1/projects/{projectId}/checkpoints/{checkpointId}/files/content:
    parameters:
      - { $ref: "#/components/parameters/projectId" }
      - { name: checkpointId, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      tags: [History]
      summary: One file as it was in this version (READ)
      parameters: [{ name: path, in: query, required: true, schema: { type: string } }]
      responses:
        "200": { description: The file, content: { application/json: { schema: { type: object, properties: { path: { type: string }, content: { type: string } } } } } }
        "404": { $ref: "#/components/responses/Problem" }

  /api/v1/projects/{projectId}/checkpoints/{checkpointId}/restore:
    parameters:
      - { $ref: "#/components/parameters/projectId" }
      - { name: checkpointId, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      tags: [History]
      summary: Put the project back to this version; the result is a new version, so it can be undone (WRITE)
      responses:
        "200": { description: The new RESTORE checkpoint, content: { application/json: { schema: { $ref: "#/components/schemas/Checkpoint" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /api/v1/projects/{projectId}/build:
    parameters: [{ $ref: "#/components/parameters/projectId" }]
    post:
      tags: [Preview]
      summary: Run the build check (WRITE)
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                type: object
                properties:
                  passed: { type: boolean }
                  exitCode: { type: integer }
                  output: { type: string }
                  durationMs: { type: integer, format: int64 }
                  timedOut: { type: boolean }

  # --------------------------------------------------------------- preview
  /api/v1/projects/{projectId}/preview:
    parameters: [{ $ref: "#/components/parameters/projectId" }]
    get:
      tags: [Preview]
      summary: Get the running preview (READ)
      responses:
        "200": { description: Running, content: { application/json: { schema: { $ref: "#/components/schemas/Preview" } } } }
        "404": { description: Nothing running, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
    post:
      tags: [Preview]
      summary: Start (or restart) a preview (WRITE)
      responses:
        "200": { description: Started, content: { application/json: { schema: { $ref: "#/components/schemas/Preview" } } } }
        "402": { $ref: "#/components/responses/QuotaExceeded" }
        "409": { description: No files to preview, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
    delete:
      tags: [Preview]
      summary: Stop the preview (WRITE)
      responses:
        "204": { description: Stopped }

  /api/v1/projects/{projectId}/preview/logs:
    parameters: [{ $ref: "#/components/parameters/projectId" }]
    get:
      tags: [Preview]
      summary: Buffered log lines as JSON (READ)
      parameters: [{ name: after, in: query, schema: { type: integer, format: int64, default: 0 }, description: Only lines with a greater seq }]
      responses:
        "200": { description: Lines, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/LogLine" } } } } }

  /api/v1/projects/{projectId}/preview/logs/stream:
    parameters: [{ $ref: "#/components/parameters/projectId" }]
    get:
      tags: [Preview]
      summary: Logs stream - buffered lines, then live (READ)
      description: |
        Server-Sent Events. Each event is `event: log`, `id: <seq>`, data a
        LogLine. Reconnect with `Last-Event-ID` to resume without replaying.
      parameters:
        - { name: after, in: query, schema: { type: integer, format: int64, default: 0 } }
        - { name: Last-Event-ID, in: header, schema: { type: string } }
      responses:
        "200": { description: Event stream, content: { text/event-stream: { schema: { type: string } } } }

  # ---------------------------------------------------------------- search
  /api/v1/projects/{projectId}/search:
    parameters: [{ $ref: "#/components/parameters/projectId" }]
    get:
      tags: [Search]
      summary: Search this project's code - hybrid vector + keyword (READ)
      parameters:
        - { name: q, in: query, required: true, schema: { type: string }, example: dark mode toggle }
        - { name: k, in: query, schema: { type: integer, default: 8, maximum: 20 } }
        - { name: mode, in: query, description: "hybrid (default), or vector / keyword alone - for measuring each half; agentic = rewrite the query, search, grade the results, retry once (model calls, metered; X-Search-Trace says what it tried)", schema: { type: string, enum: [hybrid, vector, keyword, agentic], default: hybrid } }
        - { name: vectorWeight, in: query, description: "RRF weight of the vector list for this search (0-10)", schema: { type: number } }
        - { name: keywordWeight, in: query, description: "RRF weight of the keyword list for this search (0-10)", schema: { type: number } }
        - { name: rerank, in: query, description: "reorder the top 15 with the chat model before returning k", schema: { type: boolean, default: false } }
      responses:
        "200": { description: Hits, best first, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/SearchHit" } } } } }

  /api/v1/projects/{projectId}/import/zip:
    parameters: [{ $ref: "#/components/parameters/projectId" }]
    post:
      tags: [Files]
      summary: Replace the project's files with a zip's (WRITE). Skips node_modules, .git, binaries and files over 200 KB; the old files stay in History
      parameters:
        - { name: name, in: query, description: "The zip's file name, for the History label", schema: { type: string } }
      requestBody:
        required: true
        content:
          application/zip: { schema: { type: string, format: binary } }
      responses:
        "200": { description: What was imported and skipped, content: { application/json: { schema: { $ref: "#/components/schemas/ImportReport" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /api/v1/projects/{projectId}/import/github:
    parameters: [{ $ref: "#/components/parameters/projectId" }]
    post:
      tags: [Files]
      summary: Replace the project's files with a public GitHub repo's (WRITE); /tree/<branch>/<folder> imports one folder
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [url], properties: { url: { type: string, example: "https://github.com/owner/repo" } } }
      responses:
        "200": { description: What was imported and skipped, content: { application/json: { schema: { $ref: "#/components/schemas/ImportReport" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /api/v1/projects/{projectId}/ask:
    parameters: [{ $ref: "#/components/parameters/projectId" }]
    post:
      tags: [Search]
      summary: Ask a question about this project's code - answered only from the code, with cited files and lines (READ; uses the asker's AI tokens)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [question], properties: { question: { type: string, maxLength: 1000, example: "Where is the dark mode toggle handled?" } } }
      responses:
        "200": { description: The answer, content: { application/json: { schema: { $ref: "#/components/schemas/AskAnswer" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "402": { $ref: "#/components/responses/QuotaExceeded" }
        "404": { $ref: "#/components/responses/Problem" }

  /api/v1/projects/{projectId}/approvals:
    parameters: [{ $ref: "#/components/parameters/projectId" }]
    get:
      tags: [Chat]
      summary: What the agent asked permission for - today, deleting files (READ)
      parameters:
        - { name: pending, in: query, description: only requests still waiting, schema: { type: boolean, default: false } }
      responses:
        "200": { description: Newest first, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Approval" } } } } }
  /api/v1/projects/{projectId}/approvals/{approvalId}/approve:
    parameters:
      - { $ref: "#/components/parameters/projectId" }
      - { name: approvalId, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      tags: [Chat]
      summary: Say yes - the file is deleted, its last content kept as a version (WRITE)
      responses:
        "200": { description: Decided, content: { application/json: { schema: { $ref: "#/components/schemas/Approval" } } } }
        "400": { description: Already decided }
  /api/v1/projects/{projectId}/approvals/{approvalId}/reject:
    parameters:
      - { $ref: "#/components/parameters/projectId" }
      - { name: approvalId, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      tags: [Chat]
      summary: Say no - the file stays (WRITE)
      responses:
        "200": { description: Decided, content: { application/json: { schema: { $ref: "#/components/schemas/Approval" } } } }
        "400": { description: Already decided }
  /api/v1/projects/{projectId}/memories:
    parameters: [{ $ref: "#/components/parameters/projectId" }]
    get:
      tags: [Search]
      summary: Project memory - facts every run and chat in this project starts with (READ)
      responses:
        "200": { description: Oldest first, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/MemoryFact" } } } } }
    post:
      tags: [Search]
      summary: Remember a fact about this project (WRITE)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [content], properties: { content: { type: string, maxLength: 300 } } }
      responses:
        "201": { description: Saved (or the same fact already there), content: { application/json: { schema: { $ref: "#/components/schemas/MemoryFact" } } } }
        "400": { description: "Empty, too long, a credential, or the memory is full (100 facts)" }
  /api/v1/projects/{projectId}/memories/{memoryId}:
    parameters:
      - { $ref: "#/components/parameters/projectId" }
      - { name: memoryId, in: path, required: true, schema: { type: integer, format: int64 } }
    delete:
      tags: [Search]
      summary: Forget a fact (WRITE)
      responses:
        "204": { description: Forgotten }
        "404": { description: No such memory in this project }
  /api/v1/knowledge:
    get:
      tags: [Search]
      summary: The knowledge base - ForgeFlow's reference notes the agent retrieves from
      responses:
        "200": { description: One row per note, content: { application/json: { schema: { type: array, items: { type: object, properties: { doc: { type: string }, title: { type: string }, stacks: { type: string }, sections: { type: integer } } } } } } }

  /api/v1/knowledge/search:
    get:
      tags: [Search]
      summary: Search the reference notes - the search the agent's search_docs tool runs
      parameters:
        - { name: q, in: query, required: true, schema: { type: string }, example: useEffect cleanup interval }
        - { name: k, in: query, schema: { type: integer, default: 5, maximum: 10 } }
        - { name: stack, in: query, description: "only notes for this stack", schema: { type: string, enum: [static, react] } }
        - { name: mode, in: query, description: "hybrid (default), or vector / keyword alone - for measuring each half", schema: { type: string, enum: [hybrid, vector, keyword], default: hybrid } }
      responses:
        "200": { description: Sections, best first, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/KnowledgeHit" } } } } }

  # --------------------------------------------------------------- billing
  /api/v1/billing/plans:
    get:
      tags: [Billing]
      summary: The plans you can buy (public)
      security: []
      responses:
        "200": { description: Plans, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Plan" } } } } }

  /api/v1/billing/me:
    get:
      tags: [Billing]
      summary: My plan and how much of each limit I've used
      responses:
        "200": { description: Status, content: { application/json: { schema: { $ref: "#/components/schemas/BillingStatus" } } } }

  /api/v1/billing/checkout:
    post:
      tags: [Billing]
      summary: Start paying for a plan - returns the checkout page URL
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [plan], properties: { plan: { type: string, example: PRO } } }
      responses:
        "200":
          description: Send the browser here
          content: { application/json: { schema: { type: object, properties: { sessionId: { type: string }, url: { type: string } } } } }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { description: Payments are not configured on this server }

  /api/v1/billing/cancel:
    post:
      tags: [Billing]
      summary: Stop renewing - the plan lasts until the paid period ends
      responses:
        "200": { description: Status, content: { application/json: { schema: { $ref: "#/components/schemas/BillingStatus" } } } }
        "409": { $ref: "#/components/responses/Problem" }

  /api/v1/billing/webhook/stripe:
    post:
      tags: [Billing]
      summary: Stripe's webhook (Stripe calls this, not you)
      security: []
      description: Authenticated by the `Stripe-Signature` header (HMAC-SHA256 of the raw body), not a JWT.
      parameters: [{ name: Stripe-Signature, in: header, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        "200": { description: "Processed, duplicate, or ignored" }
        "400": { description: Bad signature or body }
        "503": { description: Webhook secret not configured }

  # ------------------------------------------------------------------- mcp
  /mcp:
    post:
      tags: [MCP]
      summary: Model Context Protocol endpoint (JSON-RPC 2.0, protocol 2025-06-18)
      security: []
      description: |
        Tools: `create_project`, `generate_app`, `list_project_files`. Runs as a
        service account on the INTERNAL plan. Notifications (no `id`) get 202.

        When the server sets `FORGEFLOW_MCP_API_KEY`, every call must send it as
        `Authorization: Bearer <key>` or `X-API-Key: <key>`, or gets 401.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jsonrpc, method]
              properties:
                jsonrpc: { const: "2.0" }
                id: { oneOf: [{ type: integer }, { type: string }] }
                method: { type: string, example: tools/call }
                params: { type: object }
      responses:
        "200": { description: JSON-RPC response }
        "202": { description: Notification accepted }
        "401": { description: "The server requires an MCP key and none (or the wrong one) was sent" }
        "429": { $ref: "#/components/responses/RateLimited" }

components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }

  parameters:
    id: { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    projectId: { name: projectId, in: path, required: true, schema: { type: integer, format: int64 } }
    sessionId: { name: sessionId, in: path, required: true, schema: { type: integer, format: int64 } }

  requestBodies:
    Prompt:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [prompt]
            properties:
              prompt: { type: string, maxLength: 4000 }
              codeContext: { type: string, enum: [auto, always, off], description: "retrieved code for this run: auto (only past 15 files, the default), always, or off - for measuring RAG" }
              notes: { type: integer, minimum: 0, maximum: 5, description: "reference notes to attach (default: the configured 3; 0 = none)" }
              review: { type: boolean, description: "whether the reviewer agent checks the changes before the run may finish; absent = the server default (on)" }
    Message:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [content]
            properties:
              content: { type: string, maxLength: 4000 }
              images:
                type: array
                maxItems: 3
                description: "Screenshot to app: up to 3 images the agent builds from (PNG/JPEG/WebP, 4 MB each, checked by magic bytes)"
                items:
                  type: object
                  required: [mimeType, data]
                  properties:
                    mimeType: { type: string, enum: [image/png, image/jpeg, image/webp] }
                    data: { type: string, description: "base64, no data: prefix" }

  responses:
    Problem:
      description: Problem details
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    QuotaExceeded:
      description: A plan limit was reached
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/QuotaProblem" } } }
    RateLimited:
      description: Too many requests
      headers:
        Retry-After: { schema: { type: integer }, description: Seconds until the next request will be accepted }
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    AgentEvents:
      description: |
        Server-Sent Events as the agent works: `status`, `thinking`, `tool`,
        `file`, `tool_failed`, `build`, `repair`, then `done` (the
        GenerateResponse) - or `error`.
        Chat streams end with a `message` event holding the saved ChatTurn.
      content: { text/event-stream: { schema: { type: string } } }

  schemas:
    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        traceId: { type: string }
    QuotaProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          properties:
            quota: { type: string, enum: [PROJECTS, PREVIEWS, AI_TOKENS_PER_DAY] }
            limit: { type: integer, format: int64 }
            used: { type: integer, format: int64 }
            plan: { type: string }
            upgrade: { type: string }
    AuthResponse:
      type: object
      properties: { token: { type: string }, userId: { type: integer, format: int64 }, email: { type: string } }
    Profile:
      type: object
      properties:
        id: { type: integer, format: int64 }
        email: { type: string }
        name: { type: string }
        avatarUrl: { type: string }
        provider: { type: string }
        emailVerified: { type: boolean }
        createdAt: { type: string, format: date-time }
    Role: { type: string, enum: [OWNER, EDITOR, VIEWER, PUBLIC] }
    Project:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: string }
        ownerId: { type: integer, format: int64 }
        role: { $ref: "#/components/schemas/Role" }
        isPublic: { type: boolean }
        thumbnailUrl: { type: string }
        stack: { type: string, enum: [STATIC, REACT], description: "STATIC = HTML/CSS/JS; REACT = a Vite + React project, compiled in the browser for the preview" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Member:
      type: object
      properties:
        userId: { type: integer, format: int64 }
        email: { type: string }
        name: { type: string }
        avatarUrl: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        invitedBy: { type: integer, format: int64 }
        invitedAt: { type: string, format: date-time }
    GenerateResponse:
      type: object
      properties:
        runId: { type: integer, format: int64 }
        status: { type: string, enum: [SUCCEEDED, FAILED] }
        stopReason: { type: string, enum: [FINISH_TOOL, NO_TOOL_CALL, MAX_REPAIRS, TIMEOUT, MAX_TOOL_CALLS, TOKEN_BUDGET, ERROR] }
        summary: { type: string }
        filesWritten: { type: array, items: { type: string } }
        toolCalls: { type: integer }
        repairRounds: { type: integer }
        buildPassed: { type: boolean }
        totalTokens: { type: integer }
        durationMs: { type: integer, format: int64 }
        errorMessage: { type: string }
        toolUsage:
          type: object
          description: Calls per tool name, e.g. {"edit_file":1,"finish":1,"read_file":1}
          additionalProperties: { type: integer }
        costUsd: { type: number, description: "the run's model calls at list price, USD (0 for a model with no known price)" }
        rag:
          type: object
          description: "What retrieval added to the request: codeExcerpts, notes, recalled (earlier chat messages)"
          additionalProperties: { type: integer }
        agent: { $ref: '#/components/schemas/AgentReport' }
    AgentReport:
      type: object
      description: The agentic side of a run - routing, plan, review, guardrails, questions, memory, trajectory.
      properties:
        model: { type: string, description: the model that answered (after any fallback) }
        tier: { type: string, enum: [FAST, STRONG], description: what routing chose for this run }
        fellBack: { type: boolean, description: the chosen model failed and the fallback answered }
        plan:
          type: array
          items:
            type: object
            properties:
              title: { type: string }
              status: { type: string, enum: [pending, in_progress, done, skipped] }
        review:
          type: object
          nullable: true
          properties:
            verdict: { type: string, enum: [approve, changes, skipped] }
            rounds: { type: integer }
            summary: { type: string }
            issues:
              type: array
              items:
                type: object
                properties:
                  severity: { type: string, enum: [major, minor] }
                  file: { type: string }
                  problem: { type: string }
        guards: { type: array, items: { type: string }, description: "guardrail notices: injected instructions seen, a credential refused, a budget reached, a model fallback" }
        question: { type: string, nullable: true, description: a clarifying question the agent stopped to ask }
        options: { type: array, items: { type: string } }
        approvals: { type: array, items: { type: integer, format: int64 }, description: actions waiting for the user's approval }
        remembered: { type: array, items: { type: string }, description: facts saved to project memory in this run }
        searches: { type: array, items: { type: string }, description: what agentic retrieval tried and kept }
        trajectory: { type: array, items: { type: string }, description: "every tool call in order, e.g. read_file app.js" }
    ApiToken:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        prefix: { type: string, description: "ff_pat_ plus the first 4 characters" }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time, nullable: true }
        token: { type: string, nullable: true, description: only in the response to creating it }
    Site:
      type: object
      properties:
        slug: { type: string }
        url: { type: string, description: "relative, /s/{slug}/" }
        live: { type: boolean }
        checkpointId: { type: integer, format: int64 }
        label: { type: string }
        publishedAt: { type: string, format: date-time }
        releases:
          type: array
          items: { type: object, properties: { checkpointId: { type: integer, format: int64 }, label: { type: string }, publishedAt: { type: string, format: date-time } } }
    Checkpoint:
      type: object
      properties:
        id: { type: integer, format: int64 }
        kind: { type: string, enum: [BASELINE, RUN, RESTORE] }
        label: { type: string, description: "for RUN, the first line of the request" }
        runId: { type: integer, format: int64 }
        createdBy: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        fileCount: { type: integer }
        added: { type: integer, description: files added since the previous version }
        removed: { type: integer }
        changed: { type: integer }
    FileChange:
      type: object
      properties:
        path: { type: string }
        status: { type: string, enum: [ADDED, REMOVED, MODIFIED] }
        additions: { type: integer }
        deletions: { type: integer }
        diff: { type: string, description: "unified diff, 3 lines of context" }
        truncated: { type: boolean }
    ChatSession:
      type: object
      properties:
        id: { type: integer, format: int64 }
        projectId: { type: integer, format: int64 }
        userId: { type: integer, format: int64 }
        title: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ChatMessage:
      type: object
      properties:
        id: { type: integer, format: int64 }
        sessionId: { type: integer, format: int64 }
        role: { type: string, enum: [user, assistant, system, tool] }
        content: { type: string }
        authorId: { type: integer, format: int64 }
        toolCalls:
          type: array
          items: { type: object, properties: { name: { type: string }, path: { type: string } } }
        tokensUsed: { type: integer }
        status: { type: string }
        runId: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        images:
          type: array
          description: images sent with a user message; bytes at .../messages/{id}/attachments/{imageId}
          items: { type: object, properties: { id: { type: integer, format: int64 }, mimeType: { type: string }, sizeBytes: { type: integer } } }
        costUsd: { type: number, nullable: true, description: "assistant replies: the run's model calls at list price, USD" }
        agent: { $ref: '#/components/schemas/AgentReport' }
        review:
          nullable: true
          description: on assistant replies - the latest visual review of the result
          allOf: [{ $ref: "#/components/schemas/VisualReview" }]
    VisualReview:
      type: object
      properties:
        id: { type: integer, format: int64 }
        messageId: { type: integer, format: int64 }
        score: { type: integer, minimum: 1, maximum: 10 }
        verdict: { type: string, enum: [LOOKS_RIGHT, NEEDS_FIXES] }
        summary: { type: string }
        issues:
          type: array
          maxItems: 5
          items: { type: object, properties: { severity: { type: string, enum: [major, minor] }, text: { type: string } } }
        tokensUsed: { type: integer }
        createdAt: { type: string, format: date-time }
    ChatTurn:
      type: object
      properties:
        userMessage: { $ref: "#/components/schemas/ChatMessage" }
        assistantMessage: { $ref: "#/components/schemas/ChatMessage" }
        run: { $ref: "#/components/schemas/GenerateResponse" }
    FileEntry:
      type: object
      properties:
        path: { type: string }
        sizeBytes: { type: integer }
        version: { type: integer }
        createdBy: { type: integer, format: int64 }
        updatedBy: { type: integer, format: int64 }
        updatedAt: { type: string, format: date-time }
    Preview:
      type: object
      properties:
        url: { type: string }
        status: { type: string }
        startedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    LogLine:
      type: object
      properties:
        seq: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        source: { type: string, enum: [build, preview, http, console] }
        level: { type: string, enum: [info, warn, error] }
        message: { type: string }
    SearchHit:
      type: object
      properties:
        path: { type: string }
        startLine: { type: integer }
        endLine: { type: integer }
        score: { type: number }
        content: { type: string }
    ImportReport:
      type: object
      properties:
        source: { type: string, example: "Imported from github.com/owner/repo" }
        imported: { type: integer }
        removed: { type: integer, description: Files that were in the project and aren't in the import }
        skipped: { type: object, additionalProperties: { type: integer }, description: "Count per reason: IGNORED_FOLDER, BINARY, TOO_LARGE, UNSAFE_PATH, OVER_FILE_LIMIT" }
        bytes: { type: integer }
        checkpointId: { type: integer }
    Approval:
      type: object
      properties:
        id: { type: integer, format: int64 }
        runId: { type: integer, format: int64, nullable: true }
        kind: { type: string, enum: [DELETE_FILE] }
        path: { type: string }
        reason: { type: string, nullable: true }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED] }
        requestedBy: { type: integer, format: int64, nullable: true }
        decidedBy: { type: integer, format: int64, nullable: true }
        createdAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time, nullable: true }
    MemoryFact:
      type: object
      properties:
        id: { type: integer, format: int64, description: "how the agent refers to it: [#id]" }
        content: { type: string }
        source: { type: string, enum: [agent, user] }
        createdBy: { type: integer, format: int64, nullable: true }
        runId: { type: integer, format: int64, nullable: true, description: the run that saved it (agent facts) }
        createdAt: { type: string, format: date-time }
    KnowledgeHit:
      type: object
      properties:
