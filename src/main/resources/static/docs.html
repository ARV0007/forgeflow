<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ForgeFlow API</title>
  <!-- Swagger UI from a CDN, pinned to an exact version: no dependency to
       add to the build, and the page is only the viewer - the contract is
       openapi.yaml next to it, which the build tests against the code. -->
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui.css">
  <style>body { margin: 0; background: #fafafa; }</style>
</head>
<body>
  <div id="swagger"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-bundle.js" crossorigin></script>
  <script>
    window.ui = SwaggerUIBundle({
      url: '/openapi.yaml',
      dom_id: '#swagger',
      deepLinking: true,
      persistAuthorization: true
    });
  </script>
</body>
</html>
