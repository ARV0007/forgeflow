spring:
  application:
    name: forgeflow
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/forgeflow}
    username: ${DB_USERNAME:forgeflow}
    password: ${DB_PASSWORD:forgeflow}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: ${PORT:8081}
  # Behind Render's proxy every request arrives from the proxy's address. This
  # makes Tomcat take the client's IP from X-Forwarded-For - but ONLY when the
  # request came from a private-network proxy, so a client on the open internet
  # can't spoof its IP by sending the header itself. Rate limits key on that IP.
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

forgeflow:
  mcp:
    # The identity MCP callers act as. Created on first use, never loginable.
    service-account-email: ${FORGEFLOW_MCP_SERVICE_EMAIL:mcp-service@forgeflow.internal}
    # Blank = /mcp is open (fine locally). Set it on any public deployment;
    # clients then send "Authorization: Bearer <key>" or "X-API-Key: <key>".
    api-key: ${FORGEFLOW_MCP_API_KEY:}
  llm:
    provider: ${FORGEFLOW_LLM_PROVIDER:gemini}   # gemini | demo (offline stand-in, no key needed)
    api-key: ${GOOGLE_API_KEY:}
    model: ${FORGEFLOW_MODEL:gemini-3.1-flash-lite}
    temperature: 0.2
    connect-timeout-seconds: 10
    request-timeout-seconds: 60
  jwt:
    secret: ${JWT_SECRET:change-me-in-env-this-is-local-only}
    # A token lasts this long; active users get a fresh one past the halfway
    # point (sliding session), so only an idle tab is signed out.
    expiry-minutes: 120
    # ...but renewals stop this long after the actual sign-in.
    max-session-days: 30
  billing:
    # none (default) | fake (local dev / tests - never on a public server) | stripe
    provider: ${FORGEFLOW_BILLING_PROVIDER:none}
    # Where Stripe sends the browser back to after checkout.
    app-base-url: ${APP_BASE_URL:http://localhost:8081}
    stripe:
      secret-key: ${STRIPE_SECRET_KEY:}
      pro-price-id: ${STRIPE_PRO_PRICE_ID:}
      # whsec_... from the Stripe dashboard (or `stripe listen`). Blank = webhook answers 503.
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  ratelimit:
    enabled: true
    # Blank = in-memory buckets (fine for one instance). Set REDIS_URL
    # (redis://... or rediss://... for TLS) to share limits across instances.
    redis-url: ${REDIS_URL:}
    auth-per-minute: 10      # login + signup, per IP
    ai-per-minute: 6         # generate / chat / retry, per user
    mcp-per-minute: 30       # /mcp, per IP
    invites-per-hour: 20     # adding members, per user
    api-per-minute: 300      # everything else under /api, per user
  tracing:
    # Blank = trace ids in logs and headers only. Set to e.g. http://localhost:9411
    # (docker run -p 9411:9411 openzipkin/zipkin) to see every request as a timeline.
    zipkin-url: ${ZIPKIN_URL:}
  chat:
    # Spec: "past 10 chat messages (session history)" - the model's memory window.
    memory-messages: 10
  agent:
    max-tool-calls: 25
    max-repair-rounds: 3
    max-input-tokens: 120000
    timeout-seconds: 240
  # Domain events (code.generated). in-process: all-in-one (Render, tests).
  # kafka: the full topology - see docker-compose.full.yml and deploy/k8s.
  events:
    transport: ${FORGEFLOW_EVENTS:in-process}
    kafka:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
      client-id: ${FORGEFLOW_INSTANCE:forgeflow}
      partitions: 3
      max-attempts: 3
      backoff-ms: 500
  # false on an API instance whose indexing runs in a separate worker.
  indexer:
    enabled: ${FORGEFLOW_INDEXER_ENABLED:true}
  # File contents: postgres (default) | s3 (MinIO, R2, S3 - any SigV4 endpoint).
  storage:
    files: ${FORGEFLOW_FILE_STORAGE:postgres}
    s3:
      endpoint: ${S3_ENDPOINT:http://localhost:9000}
      region: ${S3_REGION:us-east-1}
      bucket: ${S3_BUCKET:forgeflow-files}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
  retrieval:
    # Up to this many files, the agent just reads the project; past it, each
    # request carries the top-k most relevant chunks (RAG).
    whole-project-threshold: 15
    top-k: 8
    # Reciprocal Rank Fusion weights for the two halves of hybrid search.
    # 1 and 1 is plain RRF. Set from the retrieval eval's numbers
    # (evals/run_retrieval_eval.py), not by feel.
    # Where nearest-neighbour search runs: pgvector (default) | qdrant.
    # Chunk rows (text, keyword index) stay in Postgres either way.
    vector-store: ${FORGEFLOW_VECTOR_STORE:pgvector}
    qdrant:
      url: ${QDRANT_URL:http://localhost:6333}
      collection: forgeflow_chunks
      api-key: ${QDRANT_API_KEY:}
    vector-weight: ${FORGEFLOW_RAG_VECTOR_WEIGHT:1.0}
    keyword-weight: ${FORGEFLOW_RAG_KEYWORD_WEIGHT:1.0}
    # gemini (needs GOOGLE_API_KEY) | hashing (offline, keyword-level)
    embedder: ${FORGEFLOW_EMBEDDER:gemini}
    embedding-model: gemini-embedding-001
    # async | sync | off - re-index after each run that changed files
    index-on-generate: ${FORGEFLOW_INDEX_ON_GENERATE:async}
  sandbox:
    provider: docker
    cpu-limit: 0.5
    memory-mb: 512
    pids-limit: 128
    network: none
    timeout-seconds: 30

logging:
  level:
    com.forgeflow: DEBUG
  pattern:
    # Every line carries its request's trace id (blank outside a request), so
    # grep <traceId> pulls one user action out of an interleaved log.
    level: "%5p [%X{traceId:-}]"
