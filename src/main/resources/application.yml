spring:
  application:
    name: forgeflow
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/forgeflow}
    username: ${DB_USERNAME:forgeflow}
    password: ${DB_PASSWORD:forgeflow}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: ${PORT:8081}
  # Behind Render's proxy every request arrives from the proxy's address. This
  # makes Tomcat take the client's IP from X-Forwarded-For - but ONLY when the
  # request came from a private-network proxy, so a client on the open internet
  # can't spoof its IP by sending the header itself. Rate limits key on that IP.
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

forgeflow:
  mcp:
    # The identity MCP callers act as. Created on first use, never loginable.
    service-account-email: ${FORGEFLOW_MCP_SERVICE_EMAIL:mcp-service@forgeflow.internal}
  llm:
    provider: gemini
    api-key: ${GOOGLE_API_KEY:}
    model: ${FORGEFLOW_MODEL:gemini-3.1-flash-lite}
    temperature: 0.2
    connect-timeout-seconds: 10
    request-timeout-seconds: 60
  jwt:
    secret: ${JWT_SECRET:change-me-in-env-this-is-local-only}
    expiry-minutes: 120
  billing:
    # none (default) | fake (local dev / tests - never on a public server) | stripe
    provider: ${FORGEFLOW_BILLING_PROVIDER:none}
    # Where Stripe sends the browser back to after checkout.
    app-base-url: ${APP_BASE_URL:http://localhost:8081}
    stripe:
      secret-key: ${STRIPE_SECRET_KEY:}
      pro-price-id: ${STRIPE_PRO_PRICE_ID:}
      # whsec_... from the Stripe dashboard (or `stripe listen`). Blank = webhook answers 503.
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  ratelimit:
    enabled: true
    # Blank = in-memory buckets (fine for one instance). Set REDIS_URL
    # (redis://... or rediss://... for TLS) to share limits across instances.
    redis-url: ${REDIS_URL:}
    auth-per-minute: 10      # login + signup, per IP
    ai-per-minute: 6         # generate / chat / retry, per user
    mcp-per-minute: 30       # /mcp, per IP
    invites-per-hour: 20     # adding members, per user
    api-per-minute: 300      # everything else under /api, per user
  chat:
    # Spec: "past 10 chat messages (session history)" - the model's memory window.
    memory-messages: 10
  agent:
    max-tool-calls: 25
    max-repair-rounds: 3
    max-input-tokens: 120000
    timeout-seconds: 240
  retrieval:
    # Up to this many files, the agent just reads the project; past it, each
    # request carries the top-k most relevant chunks (RAG).
    whole-project-threshold: 15
    top-k: 8
    # gemini (needs GOOGLE_API_KEY) | hashing (offline, keyword-level)
    embedder: ${FORGEFLOW_EMBEDDER:gemini}
    embedding-model: gemini-embedding-001
    # async | sync | off - re-index after each run that changed files
    index-on-generate: async
  sandbox:
    provider: docker
    cpu-limit: 0.5
    memory-mb: 512
    pids-limit: 128
    network: none
    timeout-seconds: 30

logging:
  level:
    com.forgeflow: DEBUG
