# Test profile. Layered ON TOP of src/main/resources/application.yml, never
# instead of it - a file with the same name here would silently replace the
# real config on the test classpath.
forgeflow:
  llm:
    models:
      # A failing scripted call should fail, not quietly consume the next
      # scripted answer as a "fallback". ModelRoutingTest switches it on.
      fallback: ""
  audit:
    # In the request thread, so a test can read the findings straight away.
    async: false
    # Never on a timer during tests: a 02:15 run would eat other tests' scripted answers.
    cron: "-"
  agent:
    review:
      # The reviewer adds a model call to every run that writes files; the
      # existing scripts don't include one. ReviewerAgentTest switches it on.
      enabled: false
  mcp:
    # McpServerTest drives the anonymous service-account path; tokens are tested in ApiTokenTest.
    allow-anonymous: true
  sandbox:
    # No Docker daemon in CI or on this build bench; the in-JVM provider is
    # what Render runs, so it is also what the tests should exercise.
    provider: in-process
  retrieval:
    # Ask with plain search: agentic retrieval adds model calls the existing
    # Ask scripts don't include. AgenticRetrievalTest switches it on.
    agentic:
      ask: false
    # Deterministic and offline; and indexing finishes before the request
    # returns, so tests can look at the index straight away.
    embedder: hashing
    index-on-generate: sync
  billing:
    # The fake provider runs the real activation path without a network call.
    provider: fake
    stripe:
      # Lets the tests sign webhook payloads the way Stripe would.
      webhook-secret: whsec_test_only_not_a_real_secret
  ratelimit:
    # Every test calls from 127.0.0.1 and signs up dozens of users; limits
    # would trip constantly. RateLimitTest switches them back on, low.
    enabled: false

spring:
  datasource:
    hikari:
      # Spring caches one application context per distinct test configuration,
      # each with its own pool. A dozen contexts x 10 connections ran Postgres
      # (max_connections 100) out of clients; tests need very few each.
      maximum-pool-size: 4
